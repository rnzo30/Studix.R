// ==================== LOGIN ====================
function login(){
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider)
    .then(res => {
        usuarioActual = res.user;
        guardarUsuario(usuarioActual);
        document.getElementById("loginUI").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        document.getElementById("user").innerText = "Hola " + usuarioActual.displayName;

        if(usuarioActual.email === ADMIN_EMAIL){
            document.getElementById("adminPanel").classList.remove("hidden");
            document.getElementById("adminComunicado").classList.remove("hidden");
        }
    })
    .catch(err => alert("Error al iniciar sesión: " + err.message));
}

function guardarUsuario(user){
    db.collection("usuarios").doc(user.uid).set({
    nombre: user.displayName,
    nombreLower: user.displayName.toLowerCase(),
    email: user.email
}, {merge: true});
}

function cargarCursos(){
    const libros = document.getElementById("listaLibros");
    const ejercicios = document.getElementById("listaEjercicios");

    libros.innerHTML = "";
    ejercicios.innerHTML = "";

    cursos.forEach(curso => {
        let c1 = document.createElement("div");
        c1.className = "card";
        c1.innerText = curso;
        c1.onclick = () => abrirCurso(curso, "libro");
        libros.appendChild(c1);

        let c2 = document.createElement("div");
        c2.className = "card";
        c2.innerText = curso;
        c2.onclick = () => abrirCurso(curso, "ejercicio");

}

function abrirCurso(curso, tipo){
    cursoActual = curso; tipoActual = tipo;

    document.getElementById("tituloCurso").innerText = curso;
   if(usuarioActual && usuarioActual.email === ADMIN_EMAIL){
    document.getElementById("adminUpload").classList.remove("hidden");
} else {
    document.getElementById("adminUpload").classList.add("hidden");
}

}

function subirArchivo(){
    if(!usuarioActual || usuarioActual.email !== ADMIN_EMAIL){
    return alert("No tienes permisos");
}
    const file = document.getElementById("archivo").files[0];
    if(!file) return alert("Selecciona un archivo");
    
    const ref = storage.ref("materiales/" + Date.now() + "_" + file.name);
    ref.put(file)
    .then(() => ref.getDownloadURL())
    .then(url => {
        return db.collection("contenido").add({
            curso: cursoActual,
            tipo: tipoActual,
            url: url,
            nombre: file.name
        });
    })
    .then(() => {
        alert("✅ Archivo subido correctamente");
        cargarContenido();
    })
    .catch(err => alert("❌ Error: " + err.message));
}

function cargarContenido(){
    const cont = document.getElementById("contenidoCurso");
    cont.innerHTML = "";
    db.collection("contenido")
      .where("curso","==",cursoActual)
      .where("tipo","==",tipoActual)
      .get()
      .then(snap => {
        snap.forEach(doc => {
            const d = doc.data();
            cont.innerHTML += `<div class="card">${d.nombre}<br><a href="${d.url}" target="_blank">Ver archivo</a></div>`;
        });
    });
}

// ==================== CHAT (corregido) ====================
function buscarUsuarios(){
    const texto = document.getElementById("buscarInput").value.trim().toLowerCase();

    // Si escribe poco, limpiar
    if(texto.length < 2){
        document.getElementById("resultados").innerHTML = "";
        return;
    }

    db.collection("usuarios").get().then(snapshot => {
        const cont = document.getElementById("resultados");
        cont.innerHTML = "";

        snapshot.forEach(doc => {
            const u = doc.data();

            // Evitar mostrarte a ti mismo
            if(doc.id === usuarioActual.uid) return;

            // Filtrar por nombre
            if(u.nombre && u.nombre.toLowerCase().includes(texto)){
                let div = document.createElement("div");
                div.className = "card";
                div.innerText = u.nombre;
                div.onclick = () => abrirChat(doc.id);
                cont.appendChild(div);
            }
        });
    });
}

async function abrirChat(uid){
    if(!usuarioActual) return alert("Debes iniciar sesión");
    const uid1 = usuarioActual.uid;
    otroUID = uid;
    chatActual = uid1 < uid ? uid1 + "_" + uid : uid + "_" + uid1;

    const docSnap = await db.collection("usuarios").doc(uid).get();
    if(docSnap.exists) nombreOtroUsuario = docSnap.data().nombre;

    document.getElementById("resultados").innerHTML = "";
document.getElementById("buscarInput").value = "";
    cargarChat();
}

function enviarMensaje(){
    if(!usuarioActual) return alert("Debes iniciar sesión");
    const msg = document.getElementById("msg").value.trim();
    if(!msg || !chatActual) return;

    db.collection("chats").doc(chatActual).set({
        usuarios: [usuarioActual.uid, otroUID],
        nombres: [
    usuarioActual.displayName,
    nombreOtroUsuario || "Usuario"
],
        ultimoMensaje: msg,
        fecha: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    db.collection("chats").doc(chatActual).collection("mensajes").add({
        uid: usuarioActual.uid,
        nombre: usuarioActual.displayName,
        mensaje: msg,
        fecha: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById("msg").value = "";
}

function cargarChat(){
    if(unsubscribeChat) unsubscribeChat();
    unsubscribeChat = db.collection("chats").doc(chatActual)
        .collection("mensajes")
        .orderBy("fecha", "asc")
        .onSnapshot(snap => {
    const box = document.getElementById("chatBox");
    box.innerHTML = "";

    if(snap.empty){
        box.innerHTML = "<p>No hay mensajes aún</p>";
        return;
    }
            snap.forEach(doc => {
                const d = doc.data();
                const esMio = d.uid === usuarioActual.uid;
                box.innerHTML += `
                <div style="display:flex;justify-content:${esMio ? 'flex-end' : 'flex-start'};margin:8px 0;">
                    <div style="background:${esMio ? '#ff4b2b' : '#e4e6eb'};color:${esMio?'white':'black'};padding:12px;border-radius:12px;max-width:75%;">
                        ${d.mensaje}
                    </div>
                </div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
}

function cargarListaChats(){
    if(!usuarioActual) return;
    if(unsubscribeListaChats) unsubscribeListaChats();

    unsubscribeListaChats = db.collection("chats")
        .where("usuarios", "array-contains", usuarioActual.uid)
        .orderBy("fecha", "desc")
        .onSnapshot(snapshot => {
            const lista = document.getElementById("listaChats");
            lista.innerHTML = "";
            snapshot.forEach(doc => {
                const data = doc.data();
                let nombre = "Usuario";

if(data.nombres && data.usuarios){
    const index = data.usuarios.findIndex(u => u !== usuarioActual.uid);
    nombre = data.nombres[index] || "Usuario";
}

                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `<div style="font-weight:bold">${nombre}</div><div style="font-size:13px;color:gray;">${data.ultimoMensaje || "Sin mensajes"}</div>`;
                div.onclick = async () => {
                    chatActual = doc.id;
                    otroUID = data.usuarios.find(u => u !== usuarioActual.uid);
                    const userDoc = await db.collection("usuarios").doc(otroUID).get();
                    if(userDoc.exists) nombreOtroUsuario = userDoc.data().nombre;
                    cargarChat();
                };
                lista.appendChild(div);
            });
        });
}

    }

    const txt = document.getElementById("nuevoComunicado").value.trim();
    const tipo = document.getElementById("tipoComunicado").value;
    const file = document.getElementById("archivoComunicado").files[0];

    if(txt.length < 3 && !file) return alert("Escribe algo más completo o sube un archivo");

    // Si hay archivo
    if(file){
        const ref = storage.ref("comunicados/" + Date.now() + "_" + file.name);

        ref.put(file)
        .then(() => ref.getDownloadURL())
        .then(url => {
            return db.collection("comunicados").add({
                texto: txt,
                tipo: tipo,
                archivo: url,
                nombreArchivo: file.name,
                fecha: new Date()
            });
        })
        .then(() => {
            document.getElementById("nuevoComunicado").value = "";
            document.getElementById("archivoComunicado").value = "";
            cargarComunicados();
        });

    } else {
        db.collection("comunicados").add({
            texto: txt,
            tipo: tipo,
            fecha: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            document.getElementById("nuevoComunicado").value = "";
            cargarComunicados();
        });
    }
}

function cambiarSeccion(tipo){
    seccionActual = tipo;

    document.getElementById("listaComunicados").innerHTML = "Cargando...";

function cargarComunicados(){
    if(unsubscribeComunicados) unsubscribeComunicados();

    unsubscribeComunicados = db.collection("comunicados")
      .where("tipo", "==", seccionActual)
      .orderBy("fecha", "desc")
      .onSnapshot(snap => {

        const lista = document.getElementById("listaComunicados");
        lista.innerHTML = "";

        snap.forEach(doc => {
            const data = doc.data();

            let html = `<div class="card">
                <p>${data.texto || ""}</p>`;

// 🔥 SOLO ADMIN VE EL BOTÓN
if(usuarioActual && usuarioActual.email === ADMIN_EMAIL){
    html += `<br><button onclick="eliminarComunicado('${doc.id}', '${data.archivo || ""}')" 
    style="margin-top:10px;background:#e74c3c;color:white;border:none;padding:8px;border-radius:8px;cursor:pointer;">
    🗑 Eliminar
    </button>`;
}

            if(data.archivo){
                html += `<a href="${data.archivo}" target="_blank">📎 Ver archivo (${data.nombreArchivo})</a>`;
            }

            html += `</div>`;

            lista.innerHTML += html;
        });
    });
}

function eliminarComunicado(id, archivoURL){
    if(!usuarioActual || usuarioActual.email !== ADMIN_EMAIL){
        return alert("No tienes permisos");
    }

    if(!confirm("¿Eliminar este comunicado?")) return;

    // 🔥 eliminar de Firestore
    db.collection("comunicados").doc(id).delete()
    .then(() => {

        // 🔥 eliminar archivo si existe
        if(archivoURL){
            const ref = storage.refFromURL(archivoURL);
            ref.delete().catch(err => console.log("Error borrando archivo:", err));
        }

    })
    .catch(err => alert("Error: " + err.message));
}

function generarCalendario(){
    const cont = document.getElementById("calendario");
    cont.innerHTML = "";
    const diasSemana = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
diasSemana.forEach(d => {
    cont.innerHTML += `<div style="font-weight:bold;text-align:center;">${d}</div>`;
});

    const mes = fechaActual.getMonth();
    const año = fechaActual.getFullYear();

    let primerDia = new Date(año, mes, 1).getDay();
primerDia = (primerDia === 0) ? 6 : primerDia - 1;
    const diasMes = new Date(año, mes + 1, 0).getDate();

    document.getElementById("mesActual").innerText =
        fechaActual.toLocaleDateString("es-ES", { month: "long", year: "numeric" });

    // Espacios vacíos
    for(let i=0; i<primerDia; i++){
        cont.innerHTML += `<div style="visibility:hidden;"></div>`;
    }

    for(let d=1; d<=diasMes; d++){
    let fechaStr = `${año}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    let div = document.createElement("div");
    div.className = "card";
    div.style.cursor = "pointer";
    div.style.minHeight = "80px";
    div.style.display = "flex";
    div.style.flexDirection = "column";
    div.style.justifyContent = "flex-start";

    div.onclick = () => seleccionarFecha(fechaStr);

    // Número del día
    let numero = document.createElement("div");
    numero.style.fontWeight = "bold";
    numero.innerText = d;

    // Texto de la tarea
    let tarea = document.createElement("div");
    tarea.style.fontSize = "12px";
    tarea.style.marginTop = "5px";
    tarea.style.color = "gray";

    if(notasCalendario[fechaStr]){
    tarea.innerText = notasCalendario[fechaStr];
}

    div.appendChild(numero);
    div.appendChild(tarea);

    if(fechaStr === fechaSeleccionadaGlobal){
        div.style.background = "#ff4b2b";
        div.style.color = "white";
        tarea.style.color = "white";
    }

    cont.appendChild(div);
}
}

function cargarNotasCalendario(){
    if(!usuarioActual) return;

    db.collection("calendarios")
      .doc(usuarioActual.uid)
      .collection("notas")
      .get()
      .then(snap => {
          notasCalendario = {};
          snap.forEach(doc => {
              notasCalendario[doc.id] = doc.data().texto;
          });

          generarCalendario(); // 🔥 refresca calendario
      });
}

function cambiarMes(valor){
    fechaActual.setMonth(fechaActual.getMonth() + valor);
    generarCalendario();
}

function seleccionarFecha(fecha){
    if(!usuarioActual) return;
    fechaSeleccionadaGlobal = fecha;
    document.getElementById("fechaSeleccionada").innerText = "📅 " + fecha;

    // Cargar nota
    db.collection("calendarios")
      .doc(usuarioActual.uid)
      .collection("notas")
      .doc(fecha)
      .get()
      .then(doc => {
          document.getElementById("nota").value = doc.exists ? doc.data().texto : "";
      });
    generarCalendario();
}

function guardarNota(){
    if(!usuarioActual) return;
    if(!fechaSeleccionadaGlobal) return alert("Selecciona una fecha");

    const texto = document.getElementById("nota").value;

    db.collection("calendarios")
      .doc(usuarioActual.uid)
      .collection("notas")
      .doc(fechaSeleccionadaGlobal)
      .set({
          texto: texto,
          fecha: fechaSeleccionadaGlobal
      });

        notasCalendario[fechaSeleccionadaGlobal] = texto;
    generarCalendario();

cargarProximasTareas();

    alert("✅ Guardado");
}

function cargarProximasTareas(){
    if(!usuarioActual) return;

    const hoy = new Date();
hoy.setHours(0,0,0,0);

    db.collection("calendarios")
      .doc(usuarioActual.uid)
      .collection("notas")
      .get()
      .then(snap => {

        let tareas = [];

        snap.forEach(doc => {
            const data = doc.data();

            if(!data.fecha || !data.texto) return;

            const fechaTarea = new Date(data.fecha);
fechaTarea.setHours(0,0,0,0);

            // Solo futuras o hoy
            if(fechaTarea >= hoy){
                tareas.push({
                    fecha: data.fecha,
                    texto: data.texto
                });
            }
        });

        // Ordenar por fecha más cercana
        tareas.sort((a,b) => new Date(a.fecha) - new Date(b.fecha));

        // Tomar solo 3
        tareas = tareas.slice(0,3);

        mostrarProximasTareas(tareas);
    });
}

function mostrarProximasTareas(lista){
    const cont = document.getElementById("proximasTareas");
    cont.innerHTML = "";

    if(lista.length === 0){
        cont.innerHTML = "<p>No tienes tareas próximas 🎉</p>";
        return;
    }

    lista.forEach(t => {
    cont.innerHTML += `
        <div style="padding:10px;border-bottom:1px solid #eee;">
            <div style="font-size:12px;color:gray;">📅 ${t.fecha}</div>
            <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                ${t.texto}
            </div>
        </div>
    `;
});
}
